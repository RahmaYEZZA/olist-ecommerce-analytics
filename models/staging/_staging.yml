version: 2

models:
  - name: stg_orders
    description: One row per order, with timestamps cast to the right type.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]

  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: price
        data_tests: [not_null]

  - name: stg_payments
    columns:
      - name: payment_type
        description: '"not_defined" exists in the raw data for a few payments.'
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card]
              config:
                severity: warn

  - name: stg_reviews
    description: Latest review per order (the raw table has duplicated reviews).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        description: English category name; 'unknown' when the raw category is empty.
        data_tests: [not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
